name: Deploy to AWS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build and push image
    # OIDC: this job trades a short-lived GitHub token for AWS credentials from the
    # indivisual-github-deploy role, which trusts only runs on main and develop. No AWS key is stored.
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      AWS_REGION: us-east-1
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/indivisual:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/indivisual:latest
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/indivisual:cache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/indivisual:cache,mode=max

  deploy:
    name: Rolling deploy
    # OIDC: the called workflow can only get an id-token if this job grants it.
    permissions:
      id-token: write
      contents: read
    needs: build
    uses: ./.github/workflows/restart.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
